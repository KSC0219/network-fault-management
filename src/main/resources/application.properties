spring.application.name=network-fault-management
server.port=8080

# ---- MySQL (default) ----
# Create the database first:  CREATE DATABASE fault_db;
# Credentials come from environment variables so they are never committed.
spring.datasource.url=jdbc:mysql://localhost:3306/fault_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
